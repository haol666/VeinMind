<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeinMind - 思维导图工具</title>
  <!-- 首帧前恢复上次主题，避免刷新闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem('veinmind-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">

  <!-- ===== Top Bar（48px）===== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <img class="brand-logo-img" src="assets/logo.png" alt="VeinMind logo" />
      </div>
      VeinMind
    </div>

    <div class="topbar-divider"></div>

    <input class="title-input" id="doc-title-input" type="text" placeholder="文档标题…" title="文档标题（回车保存）" />

    <div class="topbar-actions">
      <!-- File Operations -->
      <div class="topbar-group">
        <button class="icon-btn" id="btn-new" data-tooltip="新建文档 (Ctrl+N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
        </button>
        <button class="icon-btn" id="btn-save" data-tooltip="保存 (Ctrl+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        </button>
        <button class="icon-btn" id="btn-load" data-tooltip="打开 (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 14l4-4 4 4 4-4"/><path d="M3 12a9 9 0 0 1 18 0"/><path d="M3 12v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6"/></svg>
        </button>
        <select class="recent-select" id="recent-files" title="最近打开的文件">
          <option value="">最近文件…</option>
        </select>
        <button class="icon-btn" id="btn-import-opml" data-tooltip="导入 OPML">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </button>
        <button class="icon-btn" id="btn-import-mm" data-tooltip="导入 FreeMind (.mm)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </button>
      </div>

      <!-- Export -->
      <div class="topbar-group">
        <button class="text-btn" id="btn-export" data-tooltip="导出 PNG / SVG / Markdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          导出
        </button>
      </div>

      <!-- View Controls -->
      <div class="topbar-group">
        <button class="icon-btn" id="btn-center" data-tooltip="居中视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/></svg>
        </button>
        <button class="icon-btn" id="btn-fit" data-tooltip="适应屏幕">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        </button>
      </div>

      <!-- Theme Controls -->
      <div class="topbar-group">
        <button class="icon-btn theme-toggle" id="theme-toggle" data-tooltip="快捷切换明暗">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
        </button>
        <div class="theme-picker" id="theme-picker">
          <button class="icon-btn" id="theme-picker-btn" data-tooltip="主题设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a10 10 0 1 0 0 20c1.5 0 2-1 2-2 0-.6-.3-1-.6-1.4-.4-.5-.6-1-.6-1.6 0-1.2.9-2 2-2h2.7c2 0 3.5-1.5 3.5-3.5C21 6.6 17 2 12 2z"/><circle cx="7.5" cy="10.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="10.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
          </button>
          <div class="theme-popover" id="theme-popover">
            <div class="theme-popover-header">
              <span>主题外观</span>
              <span>6 款可选</span>
            </div>
            <div class="theme-grid">
              <div class="theme-card active" data-theme="light" role="button" tabindex="0" aria-label="经典亮色">
                <div class="theme-swatch"><span style="background:#FAFAFB"></span><span style="background:#5B5BD6"></span><span style="background:#1A1A2E"></span></div>
                <div class="theme-card-label">
                  <span class="theme-card-name">经典亮色</span>
                  <span class="theme-card-mode">Light · 中性靛蓝</span>
                </div>
                <svg class="theme-card-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <div class="theme-card" data-theme="dark" role="button" tabindex="0" aria-label="经典暗色">
                <div class="theme-swatch"><span style="background:#12121C"></span><span style="background:#7B7BE8"></span><span style="background:#E2E2EE"></span></div>
                <div class="theme-card-label">
                  <span class="theme-card-name">经典暗色</span>
                  <span class="theme-card-mode">Dark · 蓝紫深邃</span>
                </div>
                <svg class="theme-card-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <div class="theme-card" data-theme="ocean" role="button" tabindex="0" aria-label="海盐青">
                <div class="theme-swatch"><span style="background:#F5FAFB"></span><span style="background:#0E8A96"></span><span style="background:#12343B"></span></div>
                <div class="theme-card-label">
                  <span class="theme-card-name">海盐青</span>
                  <span class="theme-card-mode">Light · 冷调青蓝</span>
                </div>
                <svg class="theme-card-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <div class="theme-card" data-theme="amber" role="button" tabindex="0" aria-label="暖阳琥珀">
                <div class="theme-swatch"><span style="background:#FDFAF5"></span><span style="background:#C2600A"></span><span style="background:#3A2A18"></span></div>
                <div class="theme-card-label">
                  <span class="theme-card-name">暖阳琥珀</span>
                  <span class="theme-card-mode">Light · 暖调米色</span>
                </div>
                <svg class="theme-card-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <div class="theme-card" data-theme="forest" role="button" tabindex="0" aria-label="墨绿森林">
                <div class="theme-swatch"><span style="background:#0F1713"></span><span style="background:#4ADE80"></span><span style="background:#E0F2E6"></span></div>
                <div class="theme-card-label">
                  <span class="theme-card-name">墨绿森林</span>
                  <span class="theme-card-mode">Dark · 护眼深绿</span>
                </div>
                <svg class="theme-card-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <div class="theme-card" data-theme="midnight" role="button" tabindex="0" aria-label="午夜紫">
                <div class="theme-swatch"><span style="background:#14101F"></span><span style="background:#A78BFA"></span><span style="background:#ECE6F8"></span></div>
                <div class="theme-card-label">
                  <span class="theme-card-name">午夜紫</span>
                  <span class="theme-card-mode">Dark · 静谧紫罗兰</span>
                </div>
                <svg class="theme-card-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Left Tool Rail（56px）===== -->
  <aside class="tool-rail">
    <button class="icon-btn" id="btn-add-child" data-tooltip="添加子节点 (Enter / Tab)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 6h4a2 2 0 0 1 2 2v2"/><path d="M14 12h-2"/></svg>
    </button>
    <button class="icon-btn" id="btn-add-sibling" data-tooltip="添加兄弟节点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M12 8v2a2 2 0 0 1-2 2H8"/><path d="M14 12h0a2 2 0 0 0 2-2V8"/></svg>
    </button>
    <button class="icon-btn" id="btn-add-free" data-tooltip="添加漂浮主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="6" stroke-dasharray="2 2"/><path d="M12 4v2"/><path d="M12 18v2"/><path d="M4 12h2"/><path d="M18 12h2"/></svg>
    </button>
    <button class="icon-btn" id="btn-delete" data-tooltip="删除节点 (Del)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </button>

    <div class="rail-divider"></div>

    <button class="icon-btn" id="btn-undo" data-tooltip="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" data-tooltip="重做 (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>
    </button>

    <div class="rail-divider"></div>

    <button class="icon-btn" id="btn-search" data-tooltip="搜索 (Ctrl+F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>

    <div class="rail-spacer"></div>

    <button class="icon-btn" data-tooltip="键盘快捷键">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0"/><path d="M10 10h0"/><path d="M14 10h0"/><path d="M18 10h0"/><path d="M8 14h8"/></svg>
    </button>
  </aside>

  <!-- ===== Canvas Area ===== -->
  <main class="canvas-area" id="canvas-area">

    <!-- Search Bar（浮动胶囊） -->
    <div class="search-bar" id="search-bar" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="搜索节点…" autocomplete="off" />
      <span class="search-count" id="search-count"></span>
      <kbd>Enter</kbd>
    </div>

    <canvas id="mindmap-canvas"></canvas>
    <div id="empty-hint" class="hidden">正在加载思维导图…</div>
    <!-- 双击节点内联编辑（绝对定位覆盖在 Canvas 上，由 JS 定位显示） -->
    <textarea id="inline-editor" class="hidden" rows="1" spellcheck="false"></textarea>

    <!-- 属性面板（选中节点时滑入） -->
    <div class="props-panel" id="props-panel">
      <div class="props-header">
        <span class="props-title">节点属性</span>
        <button class="props-close" id="props-close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="props-body">
        <!-- 填充颜色 -->
        <div class="props-section">
          <span class="props-label">填充颜色</span>
          <div class="color-palette" id="color-palette">
            <div class="color-swatch clear" data-color="" data-tooltip="默认">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
            </div>
            <div class="color-swatch" data-color="red" style="background: var(--node-red-bg);"></div>
            <div class="color-swatch" data-color="orange" style="background: var(--node-orange-bg);"></div>
            <div class="color-swatch" data-color="green" style="background: var(--node-green-bg);"></div>
            <div class="color-swatch" data-color="blue" style="background: var(--node-blue-bg);"></div>
            <div class="color-swatch" data-color="purple" style="background: var(--node-purple-bg);"></div>
            <div class="color-swatch" data-color="gray" style="background: var(--node-gray-bg);"></div>
          </div>
        </div>
        <!-- 图标标记 -->
        <div class="props-section">
          <span class="props-label">图标标记</span>
          <div class="icon-picker" id="icon-picker">
            <div class="icon-option" data-icon="">　</div>
            <div class="icon-option" data-icon="⭐">⭐</div>
            <div class="icon-option" data-icon="🔥">🔥</div>
            <div class="icon-option" data-icon="❗">❗</div>
            <div class="icon-option" data-icon="✅">✅</div>
            <div class="icon-option" data-icon="❌">❌</div>
            <div class="icon-option" data-icon="💡">💡</div>
            <div class="icon-option" data-icon="📌">📌</div>
            <div class="icon-option" data-icon="🎯">🎯</div>
            <div class="icon-option" data-icon="📅">📅</div>
            <div class="icon-option" data-icon="🚀">🚀</div>
            <div class="icon-option" data-icon="🔗">🔗</div>
          </div>
        </div>
        <!-- 文字颜色 -->
        <div class="props-section">
          <span class="props-label">文字颜色</span>
          <div class="color-palette" id="fg-palette">
            <div class="color-swatch clear" data-color="" data-tooltip="默认">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
            </div>
            <div class="color-swatch" data-color="red" style="background: var(--node-red-fg);"></div>
            <div class="color-swatch" data-color="blue" style="background: var(--node-blue-fg);"></div>
            <div class="color-swatch" data-color="green" style="background: var(--node-green-fg);"></div>
            <label class="color-swatch color-picker" id="fg-color-picker" data-tooltip="自定义颜色" title="自定义颜色">
              <input type="color" id="fg-color-input" value="#1A1A2E" />
              <svg class="picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path d="M12 6v6l4 2"/>
              </svg>
            </label>
          </div>
        </div>
        <!-- 文字样式 -->
        <div class="props-section">
          <span class="props-label">文字样式</span>
          <div class="style-row">
            <button class="style-btn" id="btn-bold" data-tooltip="加粗 (Ctrl+B)">B</button>
            <button class="style-btn" id="btn-italic" data-tooltip="斜体">I</button>
            <button class="style-btn" id="btn-underline" data-tooltip="下划线">U</button>
            <button class="style-btn" id="btn-strike" data-tooltip="删除线">S</button>
            <div class="font-size-control">
              <button class="style-btn" id="btn-font-minus" data-tooltip="减小字号">A-</button>
              <span class="font-size-value" id="font-size-value">14</span>
              <button class="style-btn" id="btn-font-plus" data-tooltip="增大字号">A+</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 小地图（180×120，带标题栏） -->
    <div class="minimap">
      <div class="minimap-header">
        <span>概览</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      </div>
      <canvas id="minimap-canvas" width="180" height="96"></canvas>
    </div>
  </main>

  <!-- ===== Bottom Bar（36px）===== -->
  <footer class="bottombar">
    <div class="bottombar-section status">
      <span class="status-dot"></span>
      <span id="status-text">就绪</span>
    </div>
    <div class="bottombar-divider"></div>
    <div class="bottombar-section">
      <span id="node-count">0 个节点</span>
    </div>
    <div class="bottombar-divider"></div>
    <div class="bottombar-section">
      <span id="doc-name">未命名</span>
    </div>

    <div class="spacer"></div>

    <div class="shortcut-hints">
      <span><kbd>Enter</kbd> 子节点</span>
      <span><kbd>Space</kbd> 折叠</span>
    </div>

    <div class="bottombar-divider"></div>

    <!-- 布局选择 -->
    <select class="layout-select" id="layout-strategy" title="布局算法">
      <option value="tree">树形布局</option>
      <option value="logic">逻辑图</option>
      <option value="radial">放射布局</option>
      <option value="compact">紧凑布局</option>
    </select>

    <div class="bottombar-divider"></div>

    <!-- 缩放控制 -->
    <div class="zoom-control">
      <button class="zoom-btn" id="zoom-out" data-tooltip="缩小">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <span class="zoom-value" id="zoom-value">100%</span>
      <button class="zoom-btn" id="zoom-in" data-tooltip="放大">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- ===== 右键上下文菜单 ===== -->
<div class="context-menu" id="context-menu">
  <div class="menu-item" data-action="add-child">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 6h4a2 2 0 0 1 2 2v2"/><path d="M14 12h-2"/></svg>
    添加子节点
    <span class="shortcut">Enter</span>
  </div>
  <div class="menu-item" data-action="add-sibling">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M12 8v2a2 2 0 0 1-2 2H8"/><path d="M14 12h0a2 2 0 0 0 2-2V8"/></svg>
    添加兄弟节点
  </div>
  <div class="menu-item" data-action="edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    编辑节点 / 备注
  </div>
  <div class="menu-divider"></div>
  <div class="menu-item" data-action="fold">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 5-3.5 7.5-8.5 9.5C7.5 19.5 4 17 4 12V6l8.5-3.5L21 6z"/></svg>
    折叠 / 展开
    <span class="shortcut">Space</span>
  </div>
  <div class="menu-divider"></div>
  <div class="menu-item danger" data-action="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    删除节点
    <span class="shortcut">Del</span>
  </div>
  <div class="menu-divider" id="edge-menu-divider" style="display:none"></div>
  <div class="menu-item danger" id="menu-remove-edge" data-action="remove-edge" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    删除关系线
  </div>
</div>

<!-- ===== 模态框（编辑节点 / 备注）===== -->
<div class="modal-backdrop" id="modal-backdrop"></div>
<div class="modal" id="editor-modal">
  <div class="modal-header">
    <span class="modal-title">编辑节点</span>
    <button class="props-close" id="btn-modal-close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="modal-field">
      <label>节点文本</label>
      <textarea id="node-text" rows="3" placeholder="输入节点文本…"></textarea>
    </div>
    <div class="modal-field">
      <label>备注 (Notes)</label>
      <textarea id="node-notes" rows="4" placeholder="附加长文本备注（可选）…"></textarea>
    </div>
  </div>
  <div class="modal-footer">
    <button class="text-btn" id="btn-cancel-edit">取消</button>
    <button class="text-btn primary" id="btn-confirm-edit">确认</button>
  </div>
</div>

<!-- ===== Toast 通知 ===== -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
  <span id="toast-message">操作成功</span>
</div>

<script src="app.js"></script>
</body>
</html>
