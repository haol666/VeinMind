[package]
name = "veinmind"
version = "0.1.0"
description = "A mind mapping tool built with Rust + Tauri, applying layered architecture and classic design patterns."
authors = ["VeinMind Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[lib]
name = "veinmind_lib"
path = "src/lib.rs"

[[bin]]
name = "veinmind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["dialog-all", "fs-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[features]
# by default Tauri runs in production mode
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
